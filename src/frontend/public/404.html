<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VALTHORIS | Redirecting…</title>
    <meta name="theme-color" content="#041426" />
    <style>
      body {
        margin: 0;
        background: #041426;
        color: #e8f4fd;
        font-family: 'Segoe UI', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
      h1 { color: #00d4ff; letter-spacing: 0.08em; margin: 0 0 0.25rem; font-size: 1.4rem; }
      p  { color: #7a9bbf; font-size: 0.88rem; margin: 0; }
    </style>
    <script>
      // GitHub Pages SPA redirect: preserve the path and query string for
      // the client-side router when a user lands on a non-root URL.
      (function () {
        var l = window.location;
        var path = l.pathname;
        var search = l.search;
        var hash = l.hash;
        // On a GitHub Pages project site the app is served from
        // /<repo>/, so the redirect target (and index.html) live under
        // that prefix rather than at the origin root.
        var base = '/';
        if (/\.github\.io$/.test(l.hostname)) {
          var firstSegment = path.split('/')[1];
          if (firstSegment) {
            base = '/' + firstSegment + '/';
          }
        }
        var redirectUrl =
          l.origin + base + '?p=' +
          encodeURIComponent(path + search + hash);
        l.replace(redirectUrl);
      })();
    </script>
  </head>
  <body>
    <div>
      <div class="icon">🛡</div>
      <h1>VALTHORIS</h1>
      <p>Redirecting…</p>
    </div>
  </body>
</html>
