    <meta charset="UTF-8" />
    <!--
      `maximum-scale=1.0, user-scalable=no` is deliberately absent: besides
      blocking pinch-zoom (an accessibility regression), some Android WebViews
      mis-apply the locked scale in installed (standalone) mode and lay the
      page out at a fraction of the screen width, which broke every line of
      text into one character per line.
    -->

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
