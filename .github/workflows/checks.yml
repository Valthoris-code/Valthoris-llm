name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Typecheck and build
        working-directory: src/frontend
        run: npm run build

  edge-functions:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test the ai-chat function
        run: deno test --allow-net --allow-env supabase/functions/ai-chat
      - name: Test the safe-room function
        run: deno test --allow-net --allow-env supabase/functions/safe-room
      - name: Test the admin-api function
        run: deno test --allow-net --allow-env supabase/functions/admin-api
      - name: Test the admin-icp-bridge function
        run: deno test --allow-net --allow-env supabase/functions/admin-icp-bridge
