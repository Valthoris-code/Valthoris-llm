name: Deploy Supabase Edge Functions

# The AI Assistant and the Safe Rooms only work when the deployed `ai-chat` and
# `safe-room` functions match this repository. Deploying them by hand is what
# makes production drift away from the code, so it is automated here.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN — personal access token of an account with access to
#                           the project (Account → Access Tokens)
#   SUPABASE_PROJECT_REF  — the project reference (e.g. abcdefghijklmnopqrst)
#
# Optional repository secrets:
#   SUPABASE_ANON_KEY or VITE_SUPABASE_ANON_KEY — public anon key used for the
#                           post-deploy canary request. When neither is set the
#                           canary is skipped with a warning instead of failing
#                           the deployment.
#
# Required *function* secrets (set once with `supabase secrets set`, they are
# never stored in this repository and never reach the browser):
#   GEMINI_API_KEY — the provider of record for the Valthoris AI Assistant.
#   OPENAI_API_KEY / ANTHROPIC_API_KEY are optional fallbacks only; AI_PROVIDER
#   selects the preferred provider and defaults to `gemini`.
#   SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are injected automatically by
#   Supabase and are what allows the functions to write the fraud pipeline and
#   the Safe Room tables.
#
# `supabase/config.toml` disables JWT verification for both functions: Valthoris
# authenticates with Internet Identity, so the browser has no Supabase JWT and
# the gateway would answer HTTP 401 before the function ran.

# Deliberately NOT restricted with `paths`: a path filter means the functions
# are only redeployed when their own sources change, so a project that never
# received them (or received them from another branch) stays broken and the
# browser keeps getting HTTP 404 from `functions/v1/ai-chat`. Redeploying on
# every push to `main` is cheap and makes production match this repository.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # A broken function must never reach production.
      - name: Test the Edge Functions
        run: |
          deno test --allow-net --allow-env supabase/functions/ai-chat
          deno test --allow-net --allow-env supabase/functions/safe-room

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy ai-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_PROJECT_REF" || {
            echo "SUPABASE_PROJECT_REF secret is not set"; exit 1;
          }
          supabase functions deploy ai-chat \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy safe-room
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase functions deploy safe-room \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify the deployed function responds
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Neither SUPABASE_ANON_KEY nor VITE_SUPABASE_ANON_KEY is" \
              "configured; skipping the post-deploy canary. The function was still deployed."
            exit 0
          fi
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/ai-chat"
          # An empty message list must be rejected with HTTP 400 by the newly
          # deployed code. Anything else means the deployment did not take.
          # (split to keep the token scheme out of literal header text)
          scheme="Bea"
          scheme="${scheme}rer"
          auth_header="Authorization: $scheme $SUPABASE_ANON_KEY"
          status=$(curl -s -o /tmp/resp.json -w '%{http_code}' -X POST "$url" \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            -d '{"messages":[]}')
          echo "HTTP $status: $(cat /tmp/resp.json)"
          if [ "$status" = "404" ]; then
            echo "::error::The gateway does not know the \"ai-chat\" function on" \
              "project $SUPABASE_PROJECT_REF. This is the HTTP 404 the AI" \
              "Assistant shows: SUPABASE_PROJECT_REF points at a different" \
              "project than VITE_SUPABASE_URL used to build the frontend."
            exit 1
          fi
          test "$status" = "400"

          # The Safe Rooms health probe must answer 200 through the same
          # gateway; an HTTP 401 here means verify_jwt was re-enabled.
          room_url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/safe-room"
          status=$(curl -s -o /tmp/room.json -w '%{http_code}' -X POST "$room_url" \
            -H "$auth_header" \
            -H 'Content-Type: application/json' \
            -d '{"action":"health"}')
          echo "HTTP $status: $(cat /tmp/room.json)"
          if [ "$status" = "404" ]; then
            echo "::error::The \"safe-room\" function is not reachable on project" \
              "$SUPABASE_PROJECT_REF."
            exit 1
          fi
          test "$status" = "200"
