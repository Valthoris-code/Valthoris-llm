name: Provision Supabase (database & administration)

# Everything the Administration & Governance Center needs on the Supabase side
# is applied from here, so that no part of the security model depends on a
# human remembering to click through the Dashboard.
#
# What this workflow does, in order:
#   1. applies every migration in `supabase/migrations` (`supabase db push`);
#   2. enables TOTP MFA and the "Customize Access Token" hook that points at
#      `governance.custom_access_token_admin_hook`;
#   3. makes sure the `governance` schema is NOT exposed through PostgREST;
#   4. provisions the two fixed ROOT accounts by invitation (no password ever
#      travels through CI) and requires them to enrol MFA;
#   5. publishes the optional `ADMIN_ALLOWED_ORIGINS` function secret;
#   6. verifies that an anonymous caller cannot obtain administrative data.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN — personal access token (Account → Access Tokens)
#   SUPABASE_PROJECT_REF  — the project reference
#
# Optional (the migrations are applied either way):
#   SUPABASE_DB_PASSWORD  — when set, migrations are pushed with the Supabase
#                           CLI over a direct database connection. When it is
#                           not set they are applied through the Management API
#                           with SUPABASE_ACCESS_TOKEN instead, so provisioning
#                           never depends on a second credential existing.
#
# Optional repository secrets:
#   SUPABASE_SERVICE_ROLE_KEY — enables step 4. Without it the ROOT rows still
#                           exist in `governance.admins` and bind themselves as
#                           soon as the accounts are created by any other means.
#   ADMIN_ALLOWED_ORIGINS — extra browser origins allowed to call `admin-api`,
#                           comma separated (production origins are built in).
#   SUPABASE_ANON_KEY / VITE_SUPABASE_ANON_KEY — used by the final check.
#
# It is intentionally NOT restricted with `paths`: a project that never received
# the migrations stays broken silently, and running an up-to-date `db push` is
# a no-op.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: supabase-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-latest
    # The job only reads this repository; every privileged action it performs is
    # against Supabase, with Supabase credentials.
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the credentials are present
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret $name is not set; the Supabase" \
                "project cannot be provisioned from CI."
              missing=1
            fi
          done
          test "$missing" = "0"

      # The project reference is a repository secret, so the logs can never show
      # which project was actually provisioned — and a workflow that reports
      # success against the wrong project is indistinguishable from one that
      # worked. `supabase/.temp/linked-project.json` records the project this
      # repository belongs to, so the two are compared here and the run stops
      # immediately when they disagree.
      - name: Confirm the target project
        run: |
          set -euo pipefail
          expected=$(jq -r '.ref // empty' supabase/.temp/linked-project.json)
          if [ -z "$expected" ]; then
            echo "No expected project recorded in supabase/.temp/linked-project.json."
          elif [ "$expected" = "$SUPABASE_PROJECT_REF" ]; then
            echo "SUPABASE_PROJECT_REF matches the project recorded in the repository."
          else
            echo "::error::SUPABASE_PROJECT_REF does not point at the project this" \
              "repository is linked to ($expected). Fix the repository secret," \
              "otherwise everything below is applied to the wrong database."
            exit 1
          fi
          scheme="Bea"; scheme="${scheme}rer"
          curl -sS -o /tmp/project.json \
            -H "Authorization: $scheme $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" || true
          jq -r '"Project: \(.name // "?")  region: \(.region // "?")  status: \(.status // "?")"' \
            /tmp/project.json 2>/dev/null || true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ─── 1. Database ────────────────────────────────────────────────────────
      #
      # `supabase db push` needs the database password, which is a *second*
      # credential. When it is missing the migrations were simply not applied
      # and the whole workflow failed — leaving `main` red and the schema
      # unprovisioned. The access token this job already holds is enough to run
      # SQL through the Management API, so the fallback below applies exactly
      # the same files, in the same order, recording each one in
      # `supabase_migrations.schema_migrations` so that an already-applied
      # migration is never replayed (and a later `db push` stays consistent).
      - name: Apply the migrations
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            supabase link --project-ref "$SUPABASE_PROJECT_REF"
            supabase db push --include-all
            exit 0
          fi

          echo "::warning::SUPABASE_DB_PASSWORD is not set; applying the" \
            "migrations through the Management API instead."

          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          scheme="Bea"; scheme="${scheme}rer"

          run_sql() {
            # $1 = SQL. Answers with the HTTP status and leaves the body in
            # /tmp/query.json; the body may contain SQL detail and is only
            # printed when the statement failed.
            jq -n --arg q "$1" '{query: $q}' > /tmp/query.req
            curl -sS -o /tmp/query.json -w '%{http_code}' -X POST "$api" \
              -H "Authorization: $scheme $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/query.req
          }

          status=$(run_sql "CREATE SCHEMA IF NOT EXISTS supabase_migrations;
            CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
              version TEXT PRIMARY KEY,
              statements TEXT[],
              name TEXT
            );")
          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            echo "::error::Could not reach the database through the Management API (HTTP $status)."
            jq -r '.message // .error // "no detail"' /tmp/query.json || true
            exit 1
          fi

          status=$(run_sql "SELECT version FROM supabase_migrations.schema_migrations;")
          applied=$(jq -r '.[]?.version // empty' /tmp/query.json | sort -u)
          echo "Already applied: $(echo "$applied" | tr '\n' ' ')"

          # A migration that fails on a column or object that "does not exist"
          # is almost always schema drift: the object was created on this
          # project by other means, with a different shape. The logs must show
          # that shape, otherwise the failure cannot be diagnosed at all from
          # CI. Only object names are printed — never a single row of data.
          describe_governance() {
            run_sql "SELECT coalesce(jsonb_agg(x ORDER BY x->>'o'), '[]'::jsonb) AS d FROM (
                SELECT jsonb_build_object('o', c.relname, 'k', c.relkind,
                  'cols', (SELECT string_agg(a.attname, ',' ORDER BY a.attnum)
                             FROM pg_attribute a
                            WHERE a.attrelid = c.oid AND a.attnum > 0 AND NOT a.attisdropped)) AS x
                  FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
                 WHERE n.nspname = 'governance' AND c.relkind IN ('r','v','m')
              ) s;" > /dev/null || true
            echo "governance schema now contains:"
            jq -r '.[0].d[]? | "  · \(.o) (\(.k)): \(.cols // "no columns")"' /tmp/query.json 2>/dev/null \
              || echo "  (could not be read)"
          }

          describe_governance

          for file in $(ls supabase/migrations/*.sql | sort); do
            version=$(basename "$file" .sql | cut -d_ -f1)
            name=$(basename "$file" .sql)
            if echo "$applied" | grep -qx "$version"; then
              echo "· $name already applied"
              continue
            fi
            echo "· applying $name"
            status=$(run_sql "$(cat "$file")")
            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              detail=$(jq -r '.message // .error // "no detail"' /tmp/query.json || echo "no detail")
              # A migration written before this ledger existed was applied to
              # the project by other means, so its objects are already there.
              # That is a bookkeeping gap, not a failure: it is recorded and
              # reported, and only genuinely new errors stop the workflow.
              case "$detail" in
                *"already exists"*)
                  echo "::warning::$name was already applied to this project ($detail); recording it."
                  ;;
                *)
                  echo "::error::Migration $name failed (HTTP $status): $detail"
                  describe_governance
                  exit 1
                  ;;
              esac
            fi
            status=$(run_sql "INSERT INTO supabase_migrations.schema_migrations (version, name)
              VALUES ('$version', '$name') ON CONFLICT (version) DO NOTHING;")
            if [ "$status" != "200" ] && [ "$status" != "201" ]; then
              echo "::error::Could not record migration $name as applied (HTTP $status)."
              exit 1
            fi
          done

      # ─── 1b. Prove the database really carries every migration ──────────────
      #
      # The step above can only report what it did; this one reports what the
      # project *has*. A migration that never reached the ledger — the failure
      # that left the administration without `governance_admin_by_principal`
      # and made `admin-icp-bridge/session` answer 404 — is caught here even if
      # it was applied by some other route.
      - name: Verify every migration is recorded
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"
          scheme="Bea"; scheme="${scheme}rer"
          query() {
            jq -n --arg q "$1" '{query: $q}' > /tmp/verify.req
            curl -sS -o /tmp/verify.json -w '%{http_code}' -X POST "$api" \
              -H "Authorization: $scheme $SUPABASE_ACCESS_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/verify.req
          }

          test "$(query "SELECT version FROM supabase_migrations.schema_migrations;")" = "200"
          applied=$(jq -r '.[]?.version // empty' /tmp/verify.json | sort -u)
          missing=0
          for file in supabase/migrations/*.sql; do
            version=$(basename "$file" .sql | cut -d_ -f1)
            if ! echo "$applied" | grep -qx "$version"; then
              echo "::error::Migration $(basename "$file") is not recorded in" \
                "supabase_migrations.schema_migrations."
              missing=1
            fi
          done

          # The functions the administration cannot work without.
          expected="governance_admin_by_principal governance_claim_admin_principal governance_resolve_admin governance_write_audit governance_write_error"
          test "$(query "SELECT p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname LIKE 'governance\\_%';")" = "200"
          present=$(jq -r '.[]?.proname // empty' /tmp/verify.json | sort -u)
          for fn in $expected; do
            if ! echo "$present" | grep -qx "$fn"; then
              echo "::error::public.$fn does not exist on this project."
              missing=1
            fi
          done
          test "$missing" = "0"
          echo "All migrations are recorded and the administrative RPCs exist."

      # ─── 2. Authentication: MFA and the administrative access-token hook ────
      #
      # PATCH only touches the fields listed below; every other authentication
      # setting of the project is left exactly as it is.
      - name: Enable TOTP MFA and the administrative access-token hook
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth"
          scheme="Bea"; scheme="${scheme}rer"
          body='{
            "mfa_totp_enroll_enabled": true,
            "mfa_totp_verify_enabled": true,
            "hook_custom_access_token_enabled": true,
            "hook_custom_access_token_uri": "pg-functions://postgres/governance/custom_access_token_admin_hook"
          }'
          status=$(curl -sS -o /tmp/auth.json -w '%{http_code}' -X PATCH "$api" \
            -H "Authorization: $scheme $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$body")
          if [ "$status" != "200" ]; then
            echo "::error::Auth configuration failed (HTTP $status)."
            # The body may echo the request; print only the error field.
            jq -r '.message // .error // "no detail"' /tmp/auth.json || true
            exit 1
          fi
          jq -r '"MFA TOTP enrol: \(.mfa_totp_enroll_enabled)  verify: \(.mfa_totp_verify_enabled)  access-token hook: \(.hook_custom_access_token_enabled)"' /tmp/auth.json

      # ─── 3. The governance schema must stay invisible to PostgREST ──────────
      - name: Keep the governance schema out of the exposed schemas
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest"
          scheme="Bea"; scheme="${scheme}rer"
          curl -sS -o /tmp/rest.json -H "Authorization: $scheme $SUPABASE_ACCESS_TOKEN" "$api"
          current=$(jq -r '.db_schema // "public"' /tmp/rest.json)
          echo "Exposed schemas: $current"
          normalise() {
            printf '%s' "$1" | tr ',' '\n' | sed 's/^ *//; s/ *$//' \
              | grep -v '^$' | paste -sd, -
          }
          cleaned=$(printf '%s' "$current" | tr ',' '\n' | sed 's/^ *//; s/ *$//' \
            | grep -v '^governance$' | grep -v '^$' | paste -sd, -)
          # Never publish an empty list: that would take the whole REST API down.
          if [ -z "$cleaned" ]; then
            cleaned="public"
          fi
          # Compare the normalised forms so that a difference in spacing alone
          # does not trigger a pointless PostgREST restart.
          if [ "$cleaned" = "$(normalise "$current")" ]; then
            echo "The governance schema is already not exposed."
            exit 0
          fi
          echo "::warning::The governance schema was exposed through PostgREST; removing it."
          status=$(curl -sS -o /tmp/rest2.json -w '%{http_code}' -X PATCH "$api" \
            -H "Authorization: $scheme $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n --arg s "$cleaned" '{db_schema: $s}')")
          test "$status" = "200"

      # ─── 4. The two fixed ROOT accounts ─────────────────────────────────────
      #
      # They are *invited*, never created with a password: no administrator
      # credential is ever generated by, stored in, or printed by CI. The
      # trigger installed by 20260901010000 binds the account to its
      # `governance.admins` row as soon as it exists.
      - name: Provision the ROOT administrator accounts
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is not set; the ROOT" \
              "accounts were not invited. Their rows already exist in" \
              "governance.admins and bind automatically once the accounts exist."
            exit 0
          fi
          base="https://$SUPABASE_PROJECT_REF.supabase.co/auth/v1"
          scheme="Bea"; scheme="${scheme}rer"
          for email in coragem77@gmail.com tiagoferroregistos@gmail.com; do
            found=$(curl -sS -G "$base/admin/users" \
              --data-urlencode "filter=$email" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: $scheme $SUPABASE_SERVICE_ROLE_KEY" \
              | jq -r --arg e "$email" '[.users[]? | select((.email|ascii_downcase) == ($e|ascii_downcase))] | length')
            if [ "$found" != "0" ]; then
              echo "$email already exists."
              continue
            fi
            status=$(curl -sS -o /tmp/invite.json -w '%{http_code}' -X POST "$base/invite" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: $scheme $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -d "$(jq -n --arg e "$email" '{email: $e}')")
            if [ "$status" = "200" ] || [ "$status" = "201" ]; then
              echo "Invited $email."
            else
              echo "::warning::Could not invite $email (HTTP $status). Create the" \
                "account by any means; it binds itself automatically."
            fi
          done

      # ─── 5. Browser origins allowed to reach admin-api ──────────────────────
      #
      # `supabase secrets set` needs a linked project, which only happened in
      # step 1 when the database password was available; `--project-ref` covers
      # the other case.
      - name: Publish ADMIN_ALLOWED_ORIGINS
        env:
          ADMIN_ALLOWED_ORIGINS: ${{ secrets.ADMIN_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_ALLOWED_ORIGINS:-}" ]; then
            echo "No extra origins configured; admin-api keeps its built-in" \
              "production allowlist."
            exit 0
          fi
          supabase secrets set "ADMIN_ALLOWED_ORIGINS=$ADMIN_ALLOWED_ORIGINS" \
            --project-ref "$SUPABASE_PROJECT_REF"

      # ─── 6. Prove an anonymous caller gets nothing ──────────────────────────
      - name: Verify the administration refuses anonymous callers
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          url="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/admin-api/session"
          scheme="Bea"; scheme="${scheme}rer"

          # (a) No credentials at all: the gateway must reject the call.
          status=$(curl -sS -o /tmp/a.json -w '%{http_code}' "$url")
          echo "anonymous, no key -> HTTP $status"
          test "$status" != "200"

          if [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::warning::No anon key configured; skipping the anon-key probe."
            exit 0
          fi

          # (b) A valid anon key is not a session: still no administrative data.
          status=$(curl -sS -o /tmp/b.json -w '%{http_code}' "$url" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: $scheme $SUPABASE_ANON_KEY")
          echo "anon key -> HTTP $status: $(cat /tmp/b.json)"
          if [ "$status" = "404" ] && grep -q 'admin-api' /tmp/b.json; then
            echo "::error::The admin-api function is not deployed on project" \
              "$SUPABASE_PROJECT_REF."
            exit 1
          fi
          test "$status" != "200"

          # (b2) The Internet Identity bridge must refuse a bare principal.
          # Sending somebody's principal — public information — must never be
          # enough to obtain a session; only a verified delegation chain is.
          bridge="https://$SUPABASE_PROJECT_REF.supabase.co/functions/v1/admin-icp-bridge/session"
          status=$(curl -sS -o /tmp/bridge.json -w '%{http_code}' -X POST "$bridge" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: $scheme $SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"principal":"rvwuy-hzmu3-nmf3b-2sdig-lblcl-4ccmr-3uind-oe3tm-7ljre-o5xny-nae"}')
          echo "bridge, principal only -> HTTP $status"
          if [ "$status" = "404" ] && grep -q 'admin-icp-bridge' /tmp/bridge.json; then
            echo "::error::The admin-icp-bridge function is not deployed on project" \
              "$SUPABASE_PROJECT_REF; nobody can obtain an administrative session."
            exit 1
          fi
          test "$status" != "200"

          # (c) The governance schema must not answer through PostgREST.
          rest="https://$SUPABASE_PROJECT_REF.supabase.co/rest/v1/admins"
          status=$(curl -sS -o /tmp/c.json -w '%{http_code}' "$rest?select=email" \
            -H 'Accept-Profile: governance' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: $scheme $SUPABASE_ANON_KEY")
          echo "governance through PostgREST -> HTTP $status"
          test "$status" != "200"
